# =============================================================================
# VIRA Server with Ollama running natively on the host.
#
# Recommended on macOS (Metal acceleration) and for existing Ollama installs.
#
#   docker compose -f compose.host-ollama.yaml up -d --build
#
# Start native Ollama so Docker can reach it:
#   OLLAMA_HOST=0.0.0.0:11434 ollama serve
# On macOS/Windows Docker Desktop, host.docker.internal is provided by Docker.
# =============================================================================
name: vira

services:
  vira:
    build:
      context: .
      args:
        VIRA_UID: ${VIRA_UID:-1000}
        VIRA_GID: ${VIRA_GID:-1000}
    image: vira:latest
    container_name: vira-server
    restart: unless-stopped
    ports:
      - "${VIRA_BIND_ADDRESS:-0.0.0.0}:${VIRA_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VIRA_HOST: 0.0.0.0
      VIRA_PORT: 8000
      VIRA_CONFIG: /app/config.yaml
      VIRA_OLLAMA_URL: ${VIRA_OLLAMA_URL:-http://host.docker.internal:11434}
      VIRA_OLLAMA_MODEL: ${VIRA_OLLAMA_MODEL:-qwen3.5:9b}
    volumes:
      - vira-data:/app/data
      - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/livez >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    pids_limit: 512

  worker:
    image: vira:latest
    container_name: vira-worker
    restart: unless-stopped
    command: ["python", "-m", "vira.worker"]
    environment:
      VIRA_CONFIG: /app/config.yaml
      VIRA_OLLAMA_URL: ${VIRA_OLLAMA_URL:-http://host.docker.internal:11434}
      VIRA_OLLAMA_MODEL: ${VIRA_OLLAMA_MODEL:-qwen3.5:9b}
    volumes:
      - vira-data:/app/data
      - ./config.yaml:/app/config.yaml
    depends_on:
      vira:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    pids_limit: 256

volumes:
  vira-data:
