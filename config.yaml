# --- Missions: give a brief, a Master agent builds the team of experts (page: /mission) ---
# Standalone:  python -m vira.mission "Build a labour payment app in Flutter"   (add --mock to try offline)
mission:
  data_dir: data/missions       # each mission -> <data_dir>/<id>/project (the product) + meta/ (events, plan)
  model: null                   # logical name from llm.models; null = llm.default_model
  min_agents: 3                 # the Master picks the team size between min and max
  max_agents: 8
  max_tasks: 24
  review_rounds: 1              # integration review + fix-task rounds after the first build
  llm_concurrency: 1            # parallel LLM calls (local model = 1; hosted API: 3-6)
  max_llm_calls: 120            # hard budget for the whole mission - it stops gracefully when reached
  max_tokens: 4096              # per call; files are written in full, so keep this high
  temperature: 0.4
  call_timeout: 240             # seconds per LLM call
  max_replies: 8                # max unsolicited answers per agent (stops endless chatter)
  max_minutes: 90
  verify_rounds: 2              # build->run->report->fix loops after the build (0 = off)
  execute_checks: true          # really run flutter/dart/npm/pytest inside the project folder (needs the tools installed; false = static checks only)
  check_timeout: 300            # seconds per verification command
  revision_calls: 60            # extra LLM-call budget each time you ask for a change after the mission finished

