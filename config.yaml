# VIRA configuration
#
# Every key the server reads is listed here. Values can be overridden with
# environment variables using the VIRA_* pattern:
#   VIRA_AUTH_HTTPS_ONLY=true  ->  auth.https_only
#   VIRA_OLLAMA_URL=...        ->  llm.models[].base_url
#
# Keep secrets out of this file. Set auth.secret_key with an environment
# variable or edit it once locally before exposing the server.

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------
kernel:
  name: VIRA
  checkpoint_dir: ./data/checkpoints
  logs_dir: ./data/logs
  plugins_dir: ./vira/plugins
  modules_dir: ./vira/modules/core
  sensors_dir: ./vira/sensors

# ---------------------------------------------------------------------------
# Authentication and sessions
# ---------------------------------------------------------------------------
auth:
  # Replace this before exposing the server beyond localhost.
  secret_key: "change-this-to-a-random-secret-key-in-production"
  session_cookie_name: vira_session
  session_max_age: 86400        # seconds (24 hours)
  # true when TLS is enabled directly or terminated by a trusted proxy.
  https_only: false
  database_url: sqlite:///data/vira.sqlite3

# ---------------------------------------------------------------------------
# Remote access
#
# The server never assumes that the address used to open the dashboard is
# reachable from another device. Providers resolve the address used by pairing
# QR codes and clients. Add new providers in vira/access/providers.py.
#
# provider:
#   cloudflare -> Cloudflare named tunnel (falls back to LAN with a warning)
#   auto       -> Cloudflare, then LAN, then Tailscale, then the dashboard URL
#   lan        -> the server's private LAN address
#   tailscale  -> Tailscale private address (requires the app on clients)
#   request    -> the address used to open the dashboard
#   custom     -> access.public_url
# ---------------------------------------------------------------------------
access:
  provider: cloudflare
  # Legacy generic override used by provider: custom.
  public_url: null

  # Public HTTPS endpoint. No app is required on the phone.
  # Set either public_url or hostname after creating the named tunnel.
  cloudflare:
    enabled: true
    public_url: null                # e.g. https://vira.example.com
    hostname: null                  # e.g. vira.example.com (implies https)
    tunnel_name: vira
    tunnel_id: null                 # filled after guided creation
    service_url: http://127.0.0.1:8000
    binary: cloudflared

  # Private same-network address, advertised as a fallback in the pairing QR.
  lan:
    enabled: true
    scheme: http
    address: null                   # override when VIRA runs in Docker
    port: null                      # default: the dashboard port
    interface: null                 # optional interface name, e.g. enp6s0

  tailscale:
    enabled: true
    binary: tailscale
    # Optional tailnet machine name. Defaults to this host's name.
    hostname: null
    # http is encrypted by WireGuard on the tailnet. Use https + port 443
    # when VIRA is published with `tailscale serve`.
    scheme: http
    port: 8000
    prefer_dns_name: true
    timeout_seconds: 2

# ---------------------------------------------------------------------------
# Event bus, scheduler, metrics
# ---------------------------------------------------------------------------
event_bus:
  max_queue_size: 10000

scheduler:
  tick_interval: 1.0

metrics:
  enabled: true
  retention_minutes: 60

# ---------------------------------------------------------------------------
# Multi-user and multi-device platform
# ---------------------------------------------------------------------------
devices:
  credential_ttl_days: 365
  local:
    display_name: null                # default: "VIRA Server (<hostname>)"
    share_with_all_users: false
  event_policy:
    max_batch_size: 100
    max_event_payload_bytes: 65536
    max_batch_bytes: 1048576
    max_future_skew_seconds: 300
    max_past_age_days: 30
    supported_schema_versions: [1]
    events_per_minute: 1200           # per device
    heartbeats_per_minute: 30         # per device
    # First matching type rule wins. Unmatched types are rejected.
    types:
      - {pattern: "sensor.clipboard.*", class: telemetry, persist_payload: false, keep_latest: false, retention_hours: 24}
      - {pattern: "sensor.*", class: telemetry, persist_payload: false, keep_latest: true, retention_hours: 24}
      - {pattern: "device.telemetry.*", class: telemetry, persist_payload: false, keep_latest: true, retention_hours: 24}
      - {pattern: "file.*", class: activity, persist_payload: true, keep_latest: false, retention_hours: 168}
      - {pattern: "device.*", class: domain, persist_payload: true, keep_latest: false, retention_hours: 720}

# ---------------------------------------------------------------------------
# Server-local sensors
#
# The server heartbeat is a kernel event, not a sensor. It stays active even
# when every sensor below is disabled.
#
# Hardware, process and network collection are intentionally disabled. The
# dashboard does not need them; remote VIRA Link devices provide device data.
# ---------------------------------------------------------------------------
sensors:
  - name: hardware_sensor
    enabled: false
    interval: 30.0

  - name: process_sensor
    enabled: false
    interval: 15.0

  - name: network_sensor
    enabled: false
    interval: 10.0

  - name: filesystem_sensor
    enabled: false
    watch_path: ./data/watch
    recursive: true
    event_types: [created, modified, deleted, moved]
    include_patterns:
      - "*.py"
      - "*.yaml"
      - "*.yml"
      - "*.json"
      - "*.md"
      - "*.txt"
    ignore_patterns:
      - "*/data/*.db*"
    debounce_seconds: 0.5

  - name: wayland_idle_sensor
    enabled: false
    interval: 5.0
    idle_threshold_seconds: 60

  - name: user_activity_sensor
    enabled: false
    interval: 2.0
    storage_dir: ./data/user_activity
    include_content: false
    max_content_chars: 0

# ---------------------------------------------------------------------------
# Plugins and extension ecosystem
# ---------------------------------------------------------------------------
plugins:
  # Additional plugin directories. kernel.plugins_dir is always scanned.
  directories:
    - ./examples/plugins
  allow_write_tools: true
  # Omit to use the built-in permission allow-list.
  # allowed_permissions: []
  denied_permissions: []
  data_dir: ./data/plugins

# ---------------------------------------------------------------------------
# Security and tool approvals
# ---------------------------------------------------------------------------
security:
  approvals:
    enabled: true
    ttl_minutes: 30
    # Force every operation of these tools through approval.
    # destructive_tools: ["mcp_server.custom_shell"]
    # Tools allowed without a per-call approval.
    safe_tools: ["sandbox"]
    # Gate unknown MCP/plugin tools unless explicitly listed as safe.
    unknown_tools: false
    # Per-tool operation policy, for example:
    # tools:
    #   filesystem: ["write", "mkdir"]
  default_permissions:
    - "event.publish.*"
    - "command.execute.command.agent.run"
    - "context.read"
    - "context.write"
    - "memory.store.*"
    - "memory.get.*"
    - "memory.retrieve.*"
    - "knowledge.read.*"
    - "knowledge.write.*"
    # "knowledge.promote.global" is intentionally not granted by default.
    - "llm.call.*"
    - "tool.execute.*"
    - "tool.use.*"
    - "tool.use.sandbox.*"

# ---------------------------------------------------------------------------
# Request rate limits
# ---------------------------------------------------------------------------
rate_limits:
  enabled: true

# ---------------------------------------------------------------------------
# Sandbox execution
# ---------------------------------------------------------------------------
sandbox:
  backend: bubblewrap
  root: /AgentWorkspace
  execution_mode: bubblewrap        # bubblewrap | host
  bwrap_binary: bwrap               # override if bubblewrap is not on PATH
  extra_path: ""                    # e.g. "/opt/toolchain/bin:/snap/bin"
  network_enabled: true
  timeout_seconds: 900
  max_processes: 128
  cpu_seconds: 600
  memory_mb: 2048
  allow_package_install: true
  allow_shell: true
  workspace_quota_mb: 2048
  max_output_bytes: 200000
  readonly_mounts: []               # e.g. ["/opt/toolchain", "/snap"]

# ---------------------------------------------------------------------------
# Shared agent workspaces
# ---------------------------------------------------------------------------
workspace:
  root: "~/VIRA/workspaces"
  allow_user_paths: true
  default_execution_mode: bubblewrap   # bubblewrap | host

tools:
  workspace_root: .

# ---------------------------------------------------------------------------
# Knowledge storage
# ---------------------------------------------------------------------------
knowledge:
  backend: sql        # sql | memory
  cache: memory       # memory | none
  cache_ttl_seconds: 30

# ---------------------------------------------------------------------------
# Local and MCP tools
# ---------------------------------------------------------------------------
mcp_server:
  command: ["python", "vira/tools/mcp_server.py"]
  permissions: ["read", "write", "execute"]

database_mcp:
  enabled: true
  # Omit command to use the running Python interpreter.
  # command: ["python", "vira/tools/database_mcp_server.py"]
  permissions: ["read", "execute"]

# ---------------------------------------------------------------------------
# LLM providers
# ---------------------------------------------------------------------------
llm:
  default_model: qwen3.5:9b
  models:
    - name: local-llama
      provider: ollama
      model: qwen3.5:9b
      # Docker: http://ollama:11434 (bundled) or
      # http://host.docker.internal:11434 (native Ollama on the host).
      base_url: http://localhost:11434
      temperature: 0.1
      num_ctx: 65536
      think: false
      # keep_alive: 5m
      # top_p: 0.9
      # top_k: 40
      # repeat_penalty: 1.1
      # seed: 0
      # stop: []

    # Cloud examples. Uncomment and set the matching environment variable.
    # - name: gpt-4o-mini
    #   provider: openai
    #   model: gpt-4o-mini
    #   api_key: "${OPENAI_API_KEY}"
    #   temperature: 0.7
    #   max_tokens: 4096
    #
    # - name: claude-3-5-sonnet-latest
    #   provider: anthropic
    #   model: claude-3-5-sonnet-latest
    #   api_key: "${ANTHROPIC_API_KEY}"
    #   temperature: 0.7
    #   max_tokens: 4096

# ---------------------------------------------------------------------------
# Agents
# ---------------------------------------------------------------------------
agents:
  - name: Chatbot
    module: vira.agent.Agents.chat_agent
    class: ChatAgent
    agent_id: chatbot
    enabled: true
    config:
      system_prompt: "You are VIRA, a friendly, helpful assistant. For news, recent events, people, prices or anything you are not sure about, do not answer from memory: call web_search first, then web_browse on the best result, then answer from what you read and name your sources. If a tool fails, say exactly what failed."
      temperature: 0.7
      max_tokens: 65536
      max_steps: 6
      max_prompt_chars: 12000
      max_tool_chars: 3000
      max_total_tool_chars: 30000
      max_seconds: 600
      tool_timeout: 90
      tool_timeouts:
        sandbox: 600
      llm_timeout: 300
      history_limit: 20
      history_fallback: true
      history_max_conversations: 200
      learn_lessons: true
      lesson_recall_limit: 3
      delegation: true
      tools:
        allow: []
        pinned: ["sandbox"]
      # definitions_dir: "~/.vira/agents"

  - name: MorningBriefAgent
    module: vira.agent.Agents.morning_brief
    class: MorningBriefAgent
    agent_id: morning-brief
    enabled: true
    config:
      max_tokens: 700
      temperature: 0.2
      lookback_days: 1
      max_words: 220
      max_actions: 3
      include_memory: true
      include_knowledge: false
      context_tools:
        - name: user_context
        - name: insights
          params:
            days: 1

  - name: FocusCoachAgent
    module: vira.agent.Agents.focus_coach
    class: FocusCoachAgent
    agent_id: focus-coach
    enabled: true
    config:
      mode: evening
      max_tokens: 700
      temperature: 0.2
      max_words: 220
      include_apps: false
      weekly_include_apps: false
      include_memory: true

  - name: SecondBrainAgent
    module: vira.agent.Agents.second_brain
    class: SecondBrainAgent
    agent_id: second-brain
    enabled: true
    config:
      mode: ask
      max_tokens: 700
      temperature: 0.2
      max_words: 220
      stale_days: 90
      low_confidence: 0.35

  - name: ChiefOfStaffAgent
    module: vira.agent.Agents.chief_of_staff
    class: ChiefOfStaffAgent
    agent_id: chief-of-staff
    enabled: true
    config:
      mode: morning
      max_tokens: 900
      temperature: 0.2
      max_sources: 6
      max_source_chars: 7000
      context_tools: []

  - name: HouseholdAgent
    module: vira.agent.Agents.household
    class: HouseholdAgent
    agent_id: household
    enabled: true
    config:
      mode: morning
      max_tokens: 800
      temperature: 0.2
      max_words: 240
      # household_id: "..."       # default: the user's first household

agent_policy:
  load_persisted_agents: false
  allowed_modules:
    - "vira.agent"
    - "vira.modules"

# ---------------------------------------------------------------------------
# Proactive agent schedules
# ---------------------------------------------------------------------------
agent_scheduler:
  enabled: true
  tick_seconds: 20
  max_concurrent: 2
  max_runs_per_tick: 10
  lock_seconds: 300
  run_timeout_seconds: 240
  notify_on_error: true
  default_timezone: UTC

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
notifications:
  webhook_url: ""
  webhook_timeout_seconds: 10
  max_attempts: 3
  push_provider: relay              # relay | fcm
  push_relay_url: ""
  push_relay_token: ""
  push_timeout_seconds: 10
  fcm_service_account_file: ""
  fcm_project_id: ""

# ---------------------------------------------------------------------------
# Background worker
# ---------------------------------------------------------------------------
jobs:
  worker_interval: 5
  rollup_days: 3
  retention_days: 14
  schedule_run_retention_days: 30
  backup_keep: 7
