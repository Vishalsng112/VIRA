#       - "*.txt"
#     ignore_patterns:
#       - "*/data/*.db*"
#     debounce_seconds: 0.5          # to control false events when files are rapidly changed (like during git operations)


llm:
  # VIRA's final/default local model choice.
  default_model: "qwen3.5:9b"
  models:
    # - name: "gpt-4"
    #   provider: "openai"
    #   api_key: "${OPENAI_API_KEY}"   # will be resolved from env
    #   model: "gpt-4"
    #   max_tokens: 4096
    #   temperature: 0.7
    # - name: "claude-3"
    #   provider: "anthropic"
    #   api_key: "${ANTHROPIC_API_KEY}"
    #   model: "claude-3-opus-20240229"
    #   max_tokens: 4096
    - name: "local-llama"
      provider: "ollama"
      model: "qwen3.5:9b"
      # Docker: use http://ollama:11434 (bundled) or
      # http://host.docker.internal:11434 (native Ollama on the host).
      # VIRA_OLLAMA_URL overrides this value without editing the file.
      base_url: "http://localhost:11434"
      temperature: 0.1
      num_ctx: 65536             # enough room for larger context and code output
      #  set thinking mode to nothink
      thinking_mode: "nothink"

# To add another agent, create a class that extends vira.agent.base.BaseAgent
# (or vira.agent.llm_agent.LLMAgent) and register it here:
#   - name: MyAgent
#     module: my_agents.my_agent
#     class: MyAgent
#     enabled: true
#     config: {}
# BaseAgent supplies lifecycle, identity, tools/MCP, memory, knowledge,
# progress events and a typed TaskRequest/TaskResult contract.

agents:
  - name: Chatbot
    module: vira.agent.Agents.chat_agent
    class: ChatAgent
    agent_id: chatbot
    enabled: true
    config:
      system_prompt: "You are VIRA, a friendly, helpful assistant. For news, recent events, people, prices or anything you are not sure about, do not answer from memory: call web_search first, then web_browse on the best result, then answer from what you read and name your sources. If a tool fails, say exactly what failed."
      temperature: 0.7
      max_tokens: 65536
      # --- agent loop (tuned for small local models) ---
      max_steps: 6              # tool-call rounds before a forced final answer
      max_prompt_chars: 12000   # ~3k tokens; raise if your model has a bigger context
      max_tool_chars: 3000      # tool output shown to the model per call
      max_total_tool_chars: 30000  # whole-run observation budget
      max_seconds: 600          # wall-clock budget for the tool loop (builds take time)
      tool_timeout: 90          # seconds per tool call (search tries several engines)
      tool_timeouts:            # per-tool overrides; sandbox builds can run long
        sandbox: 600
      history_limit: 20         # messages kept per conversation
      learn_lessons: true       # store/recall lessons from failed tool calls
      delegation: true          # allow sub-agents from vira/agent/definitions/*.md
      # Explicit per-agent tool permission. An empty allow list means every
      # registered tool is available; add names/globs to restrict this agent.
      # 'pinned' keeps the sandbox in the prompt so code/build tasks can always
      # create an execution environment instead of only chatting about it.
      tools:
        allow: []               # e.g. ["sandbox", "web", "filesystem", "database_query.*"]
        pinned: ["sandbox"]
      # definitions_dir: "~/.vira/agents"   # your own sub-agent .md files

  # Daily brief used by proactive schedules. It pre-collects the configured
  # tools and labels missing sources instead of guessing.
  - name: MorningBriefAgent
    module: vira.agent.Agents.morning_brief
    class: MorningBriefAgent
    agent_id: morning-brief
    enabled: true
    config:
      max_tokens: 700
      lookback_days: 1
      max_words: 220
      include_memory: true
      include_knowledge: false
      context_tools:
        - name: user_context
        - name: insights
          params:
            days: 1
        # Add calendar/task/email MCP tools here once connectors are installed:
        # - name: mcp_server.calendar_today
        # - name: mcp_server.tasks_due

  # Measured daily coaching. Use schedule input {"mode": "morning" | "checkin"
  # | "evening" | "weekly"} to select the run type.
  - name: FocusCoachAgent
    module: vira.agent.Agents.focus_coach
    class: FocusCoachAgent
    agent_id: focus-coach
    enabled: true
    config:
      mode: evening
      max_tokens: 700
      max_words: 220
      include_apps: false
      weekly_include_apps: false
      include_memory: true

  # Capture, grounded recall and weekly consolidation. Use schedule input
  # {"mode": "capture" | "ask" | "consolidate"} when the message is ambiguous.
  - name: SecondBrainAgent
    module: vira.agent.Agents.second_brain
    class: SecondBrainAgent
    agent_id: second-brain
    enabled: true
    config:
      mode: ask
      max_tokens: 700
      max_words: 220
      stale_days: 90
      low_confidence: 0.35

mcp_server:
  command: ["python", "vira/tools/mcp_server.py"]   # path to your MCP server script
  permissions: ["read", "write", "execute"]

# Read-only database access for the Chatbot and agents.
# Tools: database_tables, database_schema, database_examples,
#        database_account_summary, database_query.
database_mcp:
  enabled: true
  # Omit command to use the running Python interpreter (recommended).
  # command: ["python", "vira/tools/database_mcp_server.py"]
  permissions: ["read", "execute"]

agent_policy:
  load_persisted_agents: false # only agents explicitly enabled below start at boot
  allowed_modules:
    - "vira.agent"
    - "vira.modules"
