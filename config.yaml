kernel:
  name: VIRA
  checkpoint_dir: ./data/checkpoints
  logs_dir: ./data/logs
  plugins_dir: ./vira/plugins
  modules_dir: ./vira/modules/core
  sensors_dir: ./vira/sensors


auth:
  secret_key: "change-this-to-a-random-secret-key-in-production"   # <-- generate a random string
  session_cookie_name: "vira_session"
  session_max_age: 86400  # 24 hours
  database_url: "sqlite:///data/vira.sqlite3"

# --- Multi-user / multi-device platform -------------------------------------
# The VIRA server is itself registered as an endpoint device ("server-local");
# its sensors below publish through the same ingestion path as remote devices.
devices:
  credential_ttl_days: 365        # device credentials expire; rotate before then
  local:
    display_name: null            # default: "VIRA Server (<hostname>)"
    share_with_all_users: false   # true: every active user gets viewer access to the server device
  event_policy:
    max_batch_size: 100
    max_event_payload_bytes: 65536
    max_batch_bytes: 1048576
    max_future_skew_seconds: 300
    max_past_age_days: 30
    events_per_minute: 1200       # per device
    heartbeats_per_minute: 30     # per device
    # Allow-list; first match wins. Types not matched here are rejected, and
    # user./agent./command./kernel./system./autonomous./admin. are always denied.
    types:
      - {pattern: "sensor.clipboard.*",  class: telemetry, persist_payload: false, keep_latest: false, retention_hours: 24}
      - {pattern: "sensor.*",            class: telemetry, persist_payload: false, keep_latest: true,  retention_hours: 24}
      - {pattern: "device.telemetry.*",  class: telemetry, persist_payload: false, keep_latest: true,  retention_hours: 24}
      - {pattern: "file.*",              class: activity,  persist_payload: true,  keep_latest: false, retention_hours: 168}
      - {pattern: "device.*",            class: domain,    persist_payload: true,  keep_latest: false, retention_hours: 720}

event_bus:
  max_queue_size: 10000

scheduler:
  tick_interval: 1.0

sandbox:
  backend: bubblewrap
  root: /AgentWorkspace
  network_enabled: true
  timeout_seconds: 900
  max_processes: 128
  cpu_seconds: 600
  memory_mb: 2048
  allow_package_install: true

security:
  default_permissions:
    - "event.publish.*"
    - "command.execute.command.agent.run"
    - "context.read"
    - "context.write"
    - "memory.store.*"
    - "memory.get.*"
    - "llm.call.*"
    - "tool.execute.*"
    - "tool.use.*"

metrics:
  enabled: true
  retention_minutes: 60

