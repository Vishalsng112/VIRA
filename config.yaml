agents:
  - name: Chatbot
    module: vira.agent.Agents.chat_agent
    class: ChatAgent
    enabled: true
    config:
      system_prompt: "You are VIRA, a friendly, helpful assistant. For news, recent events, people, prices or anything you are not sure about, do not answer from memory: call web_search first, then web_browse on the best result, then answer from what you read and name your sources. If a tool fails, say exactly what failed."
      temperature: 0.7
      max_tokens: 8192
      # --- agent loop (tuned for small local models) ---
      max_steps: 6              # tool-call rounds before a forced final answer
      max_prompt_chars: 12000   # ~3k tokens; raise if your model has a bigger context
      max_tool_chars: 3000      # tool output shown to the model per call
      tool_timeout: 90          # seconds per tool call (search tries several engines)
      history_limit: 20         # messages kept per conversation
      learn_lessons: true       # store/recall lessons from failed tool calls
      delegation: true          # allow sub-agents from vira/agent/definitions/*.md
      # definitions_dir: "~/.vira/agents"   # your own sub-agent .md files

  # - name: AutonomousBehaviorAgent
  #   module: vira.agent.Agents.autonomus_agent
  #   class: AutonomousAgent
  #   enabled: true
  #   config:
  #     window_size: 30
  #     anomaly_sigma: 2.0
  #     anomaly_minimum: 80.0
  #     consecutive_anomalies: 3
  #     decision_cooldown_seconds: 300
  #     learning_interval: 10
  #     llm_triage: false         # true = local LLM adds severity/explanation to decisions

  # --- Autonomous persona swarm: ONE script -> N independent agents (dashboard: /swarm) ---
  # Raise `count` for more agents (personas beyond the 3 listed come from vira/swarm/personas.py).
  - name: Swarm
    module: vira.agent.Agents.persona_agent
    class: PersonaAgent
    enabled: true
    swarm:
      count: 2
      personas: ['accounting_expert', 'dev_architect']   # + scientist, musician fill the other 2 slots
      # personas: ['accounting_expert', 'dev_architect', 'dev_backend', 'dev_io', 'dev_platform', 'dev_qa', 'dev_ux', 'gst_expert', 'inventory_engineer', 'reports_engineer', 'tech_lead']   # + scientist, musician fill the other 2 slots
      # personas: [politician, actor]   # + scientist, musician fill the other 2 slots
      # personas: [dev_architect, dev_ux, dev_qa]
    config:
      speak_interval: [20, 45]    # seconds between an agent's own turns (random jitter)
      heartbeat_interval: 5       # how often each agent announces "I'm alive"
      peer_ttl: 20                # a peer silent for this long is considered dead
      reflect_every: 4            # evolve (reflect + adjust traits) every N own turns
      llm_concurrency: 1          # parallel LLM calls shared by the swarm (local model = 1)
      max_tokens: 400
      temperature: 0.85

