llm:
  # VIRA's final/default local model choice.
  default_model: "ornith-1.5:9b"
  models:
    # - name: "gpt-4"
    #   provider: "openai"
    #   api_key: "${OPENAI_API_KEY}"   # will be resolved from env
    #   model: "gpt-4"
    #   max_tokens: 4096
    #   temperature: 0.7
    # - name: "claude-3"
    #   provider: "anthropic"
    #   api_key: "${ANTHROPIC_API_KEY}"
    #   model: "claude-3-opus-20240229"
    #   max_tokens: 4096
    - name: "local-llama"
      provider: "ollama"
      model: "ornith-1.5:9b"
      # Docker: use http://ollama:11434 (bundled) or
      # http://host.docker.internal:11434 (native Ollama on the host).
      # VIRA_OLLAMA_URL overrides this value without editing the file.
      base_url: "http://localhost:11434"
      temperature: 0.1
      num_ctx: 65536             # enough room for larger context and code output

