kernel:
  name: VIRA
  checkpoint_dir: ./data/checkpoints
  logs_dir: ./data/logs
  plugins_dir: ./vira/plugins
  modules_dir: ./vira/modules/core
  sensors_dir: ./vira/sensors

# --- Extension ecosystem (P4) -----------------------------------------------
plugins:
  # Extra directories to scan for plugin directories/manifests.  The kernel
  # plugins_dir is always scanned first.
  directories:
    - ./examples/plugins
  # Set to false to reject write/execute tools without an explicit allow-list.
  allow_write_tools: true
  denied_permissions: []
  data_dir: ./data/plugins


auth:
  secret_key: "change-this-to-a-random-secret-key-in-production"   # <-- generate a random string
  session_cookie_name: "vira_session"
  session_max_age: 86400  # 24 hours
  # Local development uses http://127.0.0.1. Set this to true when TLS is
  # enabled directly or terminated by a trusted reverse proxy.
  https_only: false
  database_url: "sqlite:///data/vira.sqlite3"

# --- Multi-user / multi-device platform -------------------------------------
# The VIRA server is itself registered as an endpoint device ("server-local");
# its sensors below publish through the same ingestion path as remote devices.
devices:
  credential_ttl_days: 365        # device credentials expire; rotate before then
  local:
    display_name: null            # default: "VIRA Server (<hostname>)"
    share_with_all_users: false   # true: every active user gets viewer access to the server device
  event_policy:
    max_batch_size: 100
    max_event_payload_bytes: 65536
    max_batch_bytes: 1048576
    max_future_skew_seconds: 300
    max_past_age_days: 30
    events_per_minute: 1200       # per device
    heartbeats_per_minute: 30     # per device
    # Allow-list; first match wins. Types not matched here are rejected, and
    # user./agent./command./kernel./system./autonomous./admin. are always denied.
    types:
      - {pattern: "sensor.clipboard.*",  class: telemetry, persist_payload: false, keep_latest: false, retention_hours: 24}
      - {pattern: "sensor.*",            class: telemetry, persist_payload: false, keep_latest: true,  retention_hours: 24}
      - {pattern: "device.telemetry.*",  class: telemetry, persist_payload: false, keep_latest: true,  retention_hours: 24}
      - {pattern: "file.*",              class: activity,  persist_payload: true,  keep_latest: false, retention_hours: 168}
      - {pattern: "device.*",            class: domain,    persist_payload: true,  keep_latest: false, retention_hours: 720}

event_bus:
  max_queue_size: 10000

scheduler:
  tick_interval: 1.0

sandbox:
  backend: bubblewrap
  root: /AgentWorkspace
  # bubblewrap = isolated; host = run directly in the shared workspace with the
  # host toolchain (opt-in; equivalent to granting shell access as the VIRA user).
  execution_mode: bubblewrap
  # Prepend host tool directories, e.g. "/opt/toolchain/bin:/snap/bin".
  extra_path: ""
  # bwrap_binary: bwrap            # override when bubblewrap is not on PATH
  network_enabled: true
  timeout_seconds: 900
  max_processes: 128
  cpu_seconds: 600
  memory_mb: 2048
  allow_package_install: true
  allow_shell: true                # strings run through /bin/bash -lc inside the sandbox
  workspace_quota_mb: 2048         # soft disk quota enforced after file operations
  max_output_bytes: 200000         # per stream, keeps huge build logs out of the prompt
  # Host SDK/toolchain paths exposed read-only inside every sandbox. Example:
  # readonly_mounts: ["/opt/toolchain", "/snap"]
  readonly_mounts: []

# Shared, user-visible project workspaces. Agents attach sandboxes to these
# directories; every agent for a user shares the default workspace.
# Set default_execution_mode: host to let agents use the host's installed tools.
workspace:
  root: "~/VIRA/workspaces"
  allow_user_paths: true
  default_execution_mode: bubblewrap   # bubblewrap | host

# Core provider-neutral tools. Keep this inside a project directory or another
# explicitly approved root; sandbox remains the option for untrusted code.
tools:
  workspace_root: .

# Knowledge storage. "sql" runs on SQLite or PostgreSQL depending on
# VIRA_DATABASE_URL; "memory" is ephemeral and intended for tests/evaluations.
knowledge:
  backend: sql        # sql | memory
  cache: memory       # memory | none
  cache_ttl_seconds: 30

# Destructive tool calls (shell, filesystem writes, sandbox writes/exec/install)
# create a single-use approval request instead of executing immediately.
security:
  # Approve or deny through /api/v1/approvals.
  approvals:
    enabled: true
    ttl_minutes: 30
    # Force every operation of these tools through approval:
    # destructive_tools: ["mcp_server.custom_shell"]
    # Always allow these even if their category looks destructive.
    # The sandbox is an isolated execution environment with its own filesystem,
    # namespace, network policy and resource limits, so agents can build and run
    # projects without a prompt per file/command. Remove "sandbox" here to
    # restore per-call approval for sandbox writes, executes and installs.
    safe_tools: ["sandbox"]
  default_permissions:
    - "event.publish.*"
    - "command.execute.command.agent.run"
    - "context.read"
    - "context.write"
    - "memory.store.*"
    - "memory.get.*"
    - "memory.retrieve.*"
    - "knowledge.read.*"
    - "knowledge.write.*"
    # Promotion into shared global knowledge is intentionally NOT granted by
    # default; add "knowledge.promote.global" to allow an agent to promote.
    - "llm.call.*"
    - "tool.execute.*"
    - "tool.use.*"
    # Explicit grant for sandbox execution environments (also covered by tool.use.*).
    - "tool.use.sandbox.*"

# Request rate limits (in-process; use Redis for multi-worker deployments).
rate_limits:
  enabled: true

# Background worker defaults (python -m vira.worker).
jobs:
  worker_interval: 5
  rollup_days: 3
  retention_days: 14
  schedule_run_retention_days: 30
  backup_keep: 7

# Proactive agent schedules run inside the API/orchestrator process.
agent_scheduler:
  enabled: true
  tick_seconds: 20
  max_concurrent: 2
  max_runs_per_tick: 10
  lock_seconds: 300
  run_timeout_seconds: 240
  notify_on_error: true
  default_timezone: "UTC"

# In-app notifications are always available. Webhook is an optional external
# delivery provider (useful for FCM/APNs gateways or a desktop notifier).
notifications:
  webhook_url: ""
  webhook_timeout_seconds: 10
  max_attempts: 3

metrics:
  enabled: true
  retention_minutes: 60

sensors:
  - name: hardware_sensor
    enabled: true
    interval: 30.0

  - name: network_sensor
    enabled: true
    interval: 10.0

  - name: process_sensor
    enabled: true
    interval: 15.0

  # - name: wayland_idle_sensor
  #   enabled: true
  #   interval: 5.0
  #   idle_threshold_seconds: 60

  # - name: user_activity_sensor
  #   enabled: true
  #   interval: 2.0
  #   include_content: false
  #   max_content_chars: 0

  # FileSystemSensor is event-driven; enable one instance per approved
  # workspace instead of recursively watching the home directory.

# sensors:
#   - name: filesystem_sensor
#     enabled: true
#     watch_path: "/home/master/Documents/GitHub/vira_framework"
#     recursive: true
#     event_types:
#       - created
#       - modified
#       - deleted
#       - moved
#     include_patterns:           # <-- only these will trigger events
#       - "*.py"
#       - "*.yaml"
#       - "*.yml"
#       - "*.json"
