<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">VIRA Server and VIRA Link client</title>
  <desc id="desc">VIRA Server runs once in Docker. VIRA Link is installed on phones and computers to collect device signals. The dashboard and chat are served by VIRA Server and open in any browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EDF3FA"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F8FF"/>
      <stop offset="1" stop-color="#E7F2FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4AA8FF"/>
      <stop offset="0.58" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#0057B8"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#17233A" flood-opacity="0.09"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#17233A" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0071E3"/>
    </marker>
    <style>
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; fill: #111827; letter-spacing: -0.5px; }
      .sub { font: 400 13px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .card-title { font: 700 20px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Arial, sans-serif; fill: #172033; letter-spacing: -0.2px; }
      .card-sub { font: 400 12px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .body { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .body-strong { font: 600 11.5px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .device-label { font: 600 11px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .device-sub { font: 400 9.5px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #8A94A6; }
      .pill { fill: #EAF3FF; stroke: #CFE3FF; stroke-width: 1; }
      .pill-text { font: 700 9.5px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #0062C4; letter-spacing: 0.2px; }
      .pill-green { fill: #EAF8EF; stroke: #CEEEDB; stroke-width: 1; }
      .pill-green-text { font: 700 9.5px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #1A7F45; letter-spacing: 0.2px; }
      .arrow { fill: none; stroke: #0071E3; stroke-width: 2; marker-end: url(#arrow); }
      .divider { stroke: #DDE5F0; stroke-width: 1; }
      .legend { font: 400 10.5px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif; fill: #64748B; }
    </style>
  </defs>

  <rect width="1200" height="540" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="170" fill="#0071E3" opacity="0.04"/>
  <circle cx="80" cy="500" r="180" fill="#8B5CF6" opacity="0.035"/>

  <!-- Header -->
  <g>
    <rect x="40" y="30" width="40" height="40" rx="12" fill="url(#brand)" filter="url(#soft)"/>
    <text x="60" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">V</text>
    <text x="94" y="52" class="title">VIRA Server + VIRA Link</text>
    <text x="94" y="69" class="sub">One server runtime. Optional device clients. Browser access for dashboard and chat.</text>
  </g>

  <!-- Server -->
  <g>
    <rect x="40" y="105" width="370" height="330" rx="24" fill="url(#server)" stroke="#CFE0F3" filter="url(#shadow)"/>
    <text x="70" y="142" class="card-title">VIRA Server</text>
    <text x="70" y="160" class="card-sub">Runs once in Docker · Linux container · anywhere</text>

    <!-- server rack -->
    <g transform="translate(70 188)">
      <rect x="0" y="0" width="86" height="104" rx="12" fill="#FFFFFF" stroke="#C9D9EA" filter="url(#soft)"/>
      <rect x="12" y="12" width="62" height="20" rx="5" fill="url(#slot)" stroke="#D3E1F0"/>
      <rect x="12" y="42" width="62" height="20" rx="5" fill="url(#slot)" stroke="#D3E1F0"/>
      <rect x="12" y="72" width="62" height="20" rx="5" fill="url(#slot)" stroke="#D3E1F0"/>
      <circle cx="22" cy="22" r="2.2" fill="#30D158"/>
      <circle cx="22" cy="52" r="2.2" fill="#30D158"/>
      <circle cx="22" cy="82" r="2.2" fill="#FF9F0A"/>
      <path d="M56 22h10M56 52h10M56 82h10" stroke="#9FB3C8" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <line x1="178" y1="192" x2="380" y2="192" class="divider"/>
    <text x="180" y="214" class="body-strong">What it contains</text>
    <text x="180" y="234" class="body">API · dashboard · chat · agents</text>
    <text x="180" y="252" class="body">tools · memory · scheduler · worker</text>
    <text x="180" y="270" class="body">SQLite or PostgreSQL · object storage</text>
    <text x="180" y="288" class="body">encryption · backups · device registry</text>

    <g transform="translate(70 314)">
      <rect width="80" height="22" rx="11" class="pill"/>
      <text x="12" y="15" class="pill-text">Docker</text>
    </g>
    <g transform="translate(158 314)">
      <rect width="92" height="22" rx="11" class="pill-green"/>
      <text x="12" y="15" class="pill-green-text">local-first</text>
    </g>
    <g transform="translate(258 314)">
      <rect width="88" height="22" rx="11" class="pill"/>
      <text x="12" y="15" class="pill-text">REST / API</text>
    </g>

    <text x="70" y="366" class="body-strong">Web console — no client install</text>
    <text x="70" y="384" class="body">Open the server URL in any modern browser:</text>
    <text x="70" y="402" class="body">http://&lt;server-ip&gt;:8000/dashboard · /chat</text>
  </g>

  <!-- Connection -->
  <g>
    <line x1="416" y1="270" x2="456" y2="270" class="arrow"/>
    <text x="436" y="252" text-anchor="middle" class="legend">sync</text>
    <text x="436" y="290" text-anchor="middle" class="legend">HTTPS</text>
  </g>

  <!-- Clients -->
  <g>
    <rect x="460" y="105" width="700" height="330" rx="24" fill="#FFFFFF" stroke="#DDE5F0" filter="url(#shadow)"/>
    <text x="490" y="142" class="card-title">VIRA Link</text>
    <text x="490" y="160" class="card-sub">Optional native device app · collects signals and syncs to the server</text>

    <line x1="490" y1="180" x2="1130" y2="180" class="divider"/>

    <!-- MacBook -->
    <g transform="translate(500 202)">
      <rect x="0" y="0" width="150" height="92" rx="8" fill="#1E293B"/>
      <rect x="6" y="6" width="138" height="80" rx="4" fill="#F8FAFC"/>
      <text x="75" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Arial, sans-serif" font-size="13" font-weight="700" fill="#0071E3">V</text>
      <text x="75" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif" font-size="8" font-weight="600" fill="#64748B">VIRA LINK</text>
      <rect x="44" y="66" width="62" height="8" rx="4" fill="#E2E8F0"/>
      <path d="M-10 96h170l-8 7H-2z" fill="#CBD5E1"/>
      <rect x="62" y="96" width="26" height="4" rx="2" fill="#94A3B8"/>
    </g>
    <text x="575" y="330" text-anchor="middle" class="device-label">MacBook</text>
    <text x="575" y="344" text-anchor="middle" class="device-sub">macOS desktop</text>

    <!-- Desktop -->
    <g transform="translate(690 210)">
      <rect x="0" y="0" width="122" height="76" rx="7" fill="#1E293B"/>
      <rect x="6" y="6" width="110" height="64" rx="3" fill="#F8FAFC"/>
      <text x="61" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Arial, sans-serif" font-size="12" font-weight="700" fill="#0071E3">V</text>
      <text x="61" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif" font-size="7" font-weight="600" fill="#64748B">VIRA LINK</text>
      <rect x="52" y="80" width="18" height="10" fill="#94A3B8"/>
      <rect x="37" y="90" width="48" height="5" rx="2.5" fill="#CBD5E1"/>
    </g>
    <text x="751" y="330" text-anchor="middle" class="device-label">Desktop</text>
    <text x="751" y="344" text-anchor="middle" class="device-sub">Linux · Windows</text>

    <!-- iPhone -->
    <g transform="translate(850 202)">
      <rect x="0" y="0" width="52" height="94" rx="12" fill="#1E293B"/>
      <rect x="4" y="4" width="44" height="86" rx="9" fill="#F8FAFC"/>
      <rect x="18" y="7" width="16" height="5" rx="2.5" fill="#1E293B"/>
      <text x="26" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Arial, sans-serif" font-size="12" font-weight="700" fill="#0071E3">V</text>
      <text x="26" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif" font-size="5.5" font-weight="600" fill="#64748B">VIRA LINK</text>
      <rect x="18" y="78" width="16" height="2.5" rx="1.25" fill="#CBD5E1"/>
    </g>
    <text x="876" y="330" text-anchor="middle" class="device-label">iPhone</text>
    <text x="876" y="344" text-anchor="middle" class="device-sub">iOS</text>

    <!-- Android -->
    <g transform="translate(940 202)">
      <rect x="0" y="0" width="52" height="94" rx="10" fill="#1E293B"/>
      <rect x="4" y="4" width="44" height="86" rx="7" fill="#F8FAFC"/>
      <circle cx="26" cy="10" r="1.6" fill="#1E293B"/>
      <text x="26" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Arial, sans-serif" font-size="12" font-weight="700" fill="#0071E3">V</text>
      <text x="26" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif" font-size="5.5" font-weight="600" fill="#64748B">VIRA LINK</text>
      <rect x="18" y="78" width="16" height="2.5" rx="1.25" fill="#CBD5E1"/>
    </g>
    <text x="966" y="330" text-anchor="middle" class="device-label">Android</text>
    <text x="966" y="344" text-anchor="middle" class="device-sub">phone / tablet</text>

    <!-- Browser -->
    <g transform="translate(1032 206)">
      <rect x="0" y="0" width="88" height="68" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="0" y="0" width="88" height="16" rx="8" fill="#EFF6FF"/>
      <circle cx="10" cy="8" r="2" fill="#FF5F57"/>
      <circle cx="18" cy="8" r="2" fill="#FEBC2E"/>
      <circle cx="26" cy="8" r="2" fill="#28C840"/>
      <rect x="8" y="24" width="72" height="28" rx="4" fill="#F8FAFC"/>
      <text x="44" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif" font-size="7" font-weight="600" fill="#64748B">dashboard</text>
    </g>
    <text x="1076" y="330" text-anchor="middle" class="device-label">Browser</text>
    <text x="1076" y="344" text-anchor="middle" class="device-sub">no install</text>

    <g transform="translate(490 368)">
      <rect x="0" y="0" width="620" height="42" rx="12" fill="#F8FAFC" stroke="#E2E9F3"/>
      <text x="14" y="17" class="body-strong">VIRA Link sends</text>
      <text x="114" y="17" class="body">device status · app usage · focus · battery · health · active window</text>
      <text x="14" y="32" class="body-strong">Browser opens</text>
      <text x="114" y="32" class="body">the server dashboard and chat; it is not a device client.</text>
    </g>
  </g>

  <!-- Footer legend -->
  <g>
    <line x1="40" y1="468" x2="1160" y2="468" class="divider"/>
    <text x="40" y="490" class="legend">VIRA Server = one Docker install: API, dashboard, agents, tools, memory, database.</text>
    <text x="1160" y="490" text-anchor="end" class="legend">VIRA Link = optional per-device sensor client.</text>
    <text x="40" y="510" class="legend">You can use the dashboard and chat without installing VIRA Link. Install VIRA Link when you want device signals from phones or desktops.</text>
  </g>
</svg>
