<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create the first VIRA administrator">
  <title>Set up VIRA</title>
  <link rel="stylesheet" href="/static/auth.css?v=apple-2">
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem("vira-theme"); } catch (e) {}
      const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || system;
    })();
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-mark" aria-hidden="true">V</span>
        <div><strong>VIRA</strong><span>Personal AI runtime</span></div>
      </div>

      <h1>Create your admin</h1>
      <p class="auth-sub">Set up the first account. Recovery codes are shown once — keep yours safe.</p>

      <form id="setup-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" required>
        </div>
        <div id="setup-error" class="error" role="alert" aria-live="polite"></div>
        <div id="setup-success" class="success" role="status" style="display:none;"></div>
        <button id="copy-recovery-code" type="button" style="display:none;">Copy recovery code</button>
        <button id="continue-to-login" type="button" style="display:none;">Continue to sign in</button>
        <button type="submit">Create admin</button>
      </form>
    </div>
  </div>

  <script>
    let recoveryCode = '';

    document.getElementById('setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const errorEl = document.getElementById('setup-error');
      const successEl = document.getElementById('setup-success');
      const copyButton = document.getElementById('copy-recovery-code');
      const loginButton = document.getElementById('continue-to-login');
      const submitButton = e.target.querySelector('button[type="submit"]');

      errorEl.textContent = '';
      successEl.style.display = 'none';
      copyButton.style.display = 'none';
      loginButton.style.display = 'none';
      submitButton.disabled = true;

      try {
        const resp = await fetch('/api/v1/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, confirm_password: confirm })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) {
          recoveryCode = data.recovery_code;
          successEl.style.display = 'block';
          successEl.innerHTML = `Admin created. Save this recovery code somewhere safe:<br><strong>${recoveryCode}</strong>`;
          copyButton.style.display = 'block';
          loginButton.style.display = 'block';
          submitButton.style.display = 'none';
        } else {
          errorEl.textContent = data.detail || 'Setup failed';
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Is the VIRA server running?';
      } finally {
        submitButton.disabled = false;
      }
    });

    document.getElementById('copy-recovery-code').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(recoveryCode);
        document.getElementById('copy-recovery-code').textContent = 'Recovery code copied';
      } catch (err) {
        document.getElementById('setup-error').textContent = 'Unable to copy automatically. Please copy the code manually.';
      }
    });

    document.getElementById('continue-to-login').addEventListener('click', () => {
      window.location.href = '/login';
    });
  </script>
</body>
</html>
