<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRA Setup</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>🧠 VIRA</h1>
      <h2>First‑time Setup</h2>
      <p>Create an admin account.</p>
      <form id="setup-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label>Password (min 6 chars)</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm-password" required>
        </div>
        <div id="setup-error" class="error"></div>
        <div id="setup-success" class="success" style="display:none;"></div>
        <button id="copy-recovery-code" type="button" style="display:none;">Copy recovery code</button>
        <button id="continue-to-login" type="button" style="display:none;">Continue to login</button>
        <button type="submit">Create Admin</button>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const errorEl = document.getElementById('setup-error');
      const successEl = document.getElementById('setup-success');
      const copyButton = document.getElementById('copy-recovery-code');
      const loginButton = document.getElementById('continue-to-login');
      let recoveryCode = '';
      errorEl.textContent = '';
      successEl.style.display = 'none';
      copyButton.style.display = 'none';
      loginButton.style.display = 'none';
      try {
        const resp = await fetch('/api/v1/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, confirm_password: confirm })
        });
        const data = await resp.json();
        if (resp.ok) {
          recoveryCode = data.recovery_code;
          successEl.style.display = 'block';
          successEl.innerHTML = `✅ Admin created!<br>Recovery code: <strong>${recoveryCode}</strong><br>Please save this code before continuing.`;
          copyButton.style.display = 'block';
          loginButton.style.display = 'block';
        } else {
          errorEl.textContent = data.detail || 'Setup failed';
        }
      } catch (err) {
        errorEl.textContent = 'Network error';
      }
    });

    document.getElementById('copy-recovery-code').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(recoveryCode);
        document.getElementById('copy-recovery-code').textContent = 'Recovery code copied';
      } catch (err) {
        document.getElementById('setup-error').textContent = 'Unable to copy automatically. Please copy the code manually.';
      }
    });

    document.getElementById('continue-to-login').addEventListener('click', () => {
      window.location.href = '/login';
    });
  </script>
</body>
</html>
