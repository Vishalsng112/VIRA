<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your VIRA password">
  <title>Reset password · VIRA</title>
  <link rel="icon" type="image/png" href="/static/branding/favicon-32.png">
  <link rel="stylesheet" href="/static/auth.css?v=vira-2">
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem("vira-theme"); } catch (e) {}
      const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || system;
    })();
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="auth-mark" src="/static/branding/vira-logo.svg" alt="" aria-hidden="true">
        <div><strong>VIRA</strong><span>Personal AI runtime</span></div>
      </div>

      <h1>Reset password</h1>
      <p class="auth-sub">Use your recovery code to choose a new password.</p>

      <form id="forgot-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="recovery-code">Recovery code</label>
          <input type="text" id="recovery-code" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" autocomplete="new-password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" required>
        </div>
        <div id="forgot-error" class="error" role="alert" aria-live="polite"></div>
        <div id="forgot-success" class="success" role="status" style="display:none;"></div>
        <button type="submit">Reset password</button>
      </form>

      <div class="auth-links">
        <a href="/login">Back to sign in</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const recovery_code = document.getElementById('recovery-code').value;
      const new_password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const errorEl = document.getElementById('forgot-error');
      const successEl = document.getElementById('forgot-success');
      const button = e.target.querySelector('button[type="submit"]');
      errorEl.textContent = '';
      successEl.style.display = 'none';
      button.disabled = true;
      try {
        const resp = await fetch('/api/v1/auth/password/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, recovery_code, new_password, confirm_password: confirm })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) {
          successEl.style.display = 'block';
          successEl.textContent = 'Password reset. Taking you back to sign in…';
          setTimeout(() => { window.location.href = '/login'; }, 2400);
        } else {
          errorEl.textContent = data.detail || 'Reset failed. Check your recovery code.';
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Is the VIRA server running?';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
