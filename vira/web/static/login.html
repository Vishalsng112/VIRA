<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to VIRA">
  <title>Sign in · VIRA</title>
  <link rel="stylesheet" href="/static/auth.css?v=apple-2">
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem("vira-theme"); } catch (e) {}
      const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved || system;
    })();
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-mark" aria-hidden="true">V</span>
        <div><strong>VIRA</strong><span>Personal AI runtime</span></div>
      </div>

      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to your local control center.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="error" role="alert" aria-live="polite"></div>
        <button type="submit">Sign in</button>
      </form>

      <div class="auth-links">
        <a href="/forgot">Forgot your password?</a>
      </div>
      <p class="auth-note">Your data stays on this machine. VIRA never sends your conversations to a third party by default.</p>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      const button = e.target.querySelector('button[type="submit"]');
      errorEl.textContent = '';
      button.disabled = true;
      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (resp.ok) {
          window.location.href = '/dashboard';
        } else {
          const data = await resp.json().catch(() => ({}));
          errorEl.textContent = data.detail || 'Login failed. Check your username and password.';
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Is the VIRA server running?';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
