name: docs

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs*.yml"
      - "requirements-docs.txt"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-revision-date-localized needs full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 \
            libgdk-pixbuf-2.0-0 libffi8 fontconfig \
            fonts-dejavu-core fonts-noto-color-emoji

      # Best-effort: app import needs the runtime dependencies. If this fails the
      # site still builds, and the API page shows the generated-schema warning.
      - name: Generate OpenAPI schema
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          python scripts/export_openapi.py

      - name: Build HTML (strict)
        run: mkdocs build --strict

      - name: Build User Manual PDF
        env:
          ENABLE_PDF_EXPORT: "1"
        run: mkdocs build -f mkdocs.pdf-user.yml

      - name: Build Developer Manual PDF
        env:
          ENABLE_PDF_EXPORT: "1"
        run: mkdocs build -f mkdocs.pdf-dev.yml

      - name: Upload HTML site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: site/

      - name: Upload PDF manuals
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: |
            site-pdf/user/pdf/vira-user-manual.pdf
            site-pdf/dev/pdf/vira-developer-manual.pdf

      # Versioned deploy to the gh-pages branch.
      # One-time setup: Settings > Pages > Source: "Deploy from a branch" > gh-pages / root.
      - name: Deploy versioned site (mike)
        if: github.event_name == 'push'
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            mike deploy --push --update-aliases "$VERSION" latest
          else
            mike deploy --push dev latest
          fi
          mike set-default --push latest

      - name: Attach manuals to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            site-pdf/user/pdf/vira-user-manual.pdf
            site-pdf/dev/pdf/vira-developer-manual.pdf
