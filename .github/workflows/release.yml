name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate version and changelog
        run: python3 scripts/release_tools.py check "${GITHUB_REF_NAME}"

      - name: Run release-critical tests
        run: |
          python3 -m unittest \
            vira.tests.test_openapi_contract \
            vira.tests.test_security_phase3 \
            vira.tests.test_phase5 \
            vira.tests.test_examples \
            vira.tests.test_database_query \
            vira.tests.test_backup_drill

      - name: Build source archive and checksums
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="VIRA-${VERSION}/" \
            -o "dist/vira-${VERSION}-source.tar.gz" HEAD
          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Extract release notes
        run: |
          python3 scripts/release_tools.py notes "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: VIRA ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/*.tar.gz
            dist/checksums.txt
