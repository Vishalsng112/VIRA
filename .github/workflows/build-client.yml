name: Build VIRA Link (all platforms)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Client version (example: 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      create_release:
        description: "Publish a GitHub Release with every client build"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: vira-link-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      base: ${{ steps.ver.outputs.base }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Work out version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          BASE="vira-link-${VERSION}"
          {
            echo "version=$VERSION"
            echo "base=$BASE"
            echo "tag=vira-link-v${VERSION}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Analyze and test
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate client release metadata
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: python3 scripts/release_tools.py check "$TAG" --product client

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze

      - name: Test
        working-directory: client
        run: flutter test

  android:
    name: Android APK
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Configure optional Android release signing
        working-directory: client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No Android signing secrets configured; using the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/app/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          EOF

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release

      - name: Stage artifact
        working-directory: client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-android
          path: dist/${{ needs.meta.outputs.base }}-android.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS app (unsigned)
    needs: [meta, verify]
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build iOS app without code signing
        working-directory: client
        run: flutter build ios --release --no-codesign

      - name: Stage artifact
        working-directory: client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-ios-unsigned.zip"

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-ios
          path: dist/${{ needs.meta.outputs.base }}-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web PWA
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build web release
        working-directory: client
        run: flutter build web --release --no-wasm-dry-run

      - name: Stage artifact
        working-directory: client/build/web
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          zip -qr "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-web.zip" .

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-web
          path: dist/${{ needs.meta.outputs.base }}-web.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux AppImage
    needs: [meta, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libgl1-mesa-dev libglu1-mesa-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Download appimagetool
        working-directory: client
        run: |
          mkdir -p build/tools
          wget -q -O build/tools/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/tools/appimagetool

      - name: Build AppImage
        working-directory: client
        env:
          APPIMAGETOOL: ${{ github.workspace }}/client/build/tools/appimagetool
          APPIMAGETOOL_FLAGS: --appimage-extract-and-run
        run: ./packaging/build_appimage.sh

      - name: Stage artifact
        working-directory: client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/VIRA-Link-x86_64.AppImage \
            "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-linux-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-linux
          path: dist/${{ needs.meta.outputs.base }}-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows EXE
    needs: [meta, verify]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "$env:GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-windows
          path: dist/${{ needs.meta.outputs.base }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS app (arm64)
    needs: [meta, verify]
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build macOS app
        working-directory: client
        run: flutter build macos --release

      - name: Stage artifact
        working-directory: client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/vira_link.app \
            "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-macos-arm64.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-macos
          path: dist/${{ needs.meta.outputs.base }}-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: ${{ inputs.create_release }}
    needs: [meta, android, ios, web, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          cd dist
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete

      - name: Verify assets and generate checksums
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          python3 scripts/release_tools.py assets "$TAG" \
            --product client \
            --dist dist \
            --write-checksums

      - name: Generate release notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          python3 scripts/release_tools.py notes "$TAG" \
            --product client \
            --dist dist > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: VIRA Link ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            dist/*
