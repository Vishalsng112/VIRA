name: Build VIRA Link (all platforms)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Client version (example: 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: "Build number (leave empty to use the workflow run number)"
        required: false
        default: ""
        type: string
      create_release:
        description: "Publish a GitHub Release with every client build"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: vira-link-build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      base: ${{ steps.ver.outputs.base }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Work out version and build number
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          BUILD="${INPUT_BUILD:-$RUN_NUMBER}"
          BASE="vira-link-${VERSION}-build${BUILD}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=${BASE}" >> "$GITHUB_OUTPUT"

  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze

      - name: Test
        working-directory: client
        run: flutter test

  android:
    name: Android APK
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release

      - name: Stage artifact
        working-directory: client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-android
          path: dist/${{ needs.meta.outputs.base }}-android.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS app (unsigned)
    needs: [meta, verify]
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build iOS app without code signing
        working-directory: client
        run: flutter build ios --release --no-codesign

      - name: Stage artifact
        working-directory: client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-ios-unsigned.zip"

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-ios
          path: dist/${{ needs.meta.outputs.base }}-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web PWA
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build web release
        working-directory: client
        run: flutter build web --release --no-wasm-dry-run

      - name: Stage artifact
        working-directory: client/build/web
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          zip -qr "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-web.zip" .

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-web
          path: dist/${{ needs.meta.outputs.base }}-web.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux AppImage
    needs: [meta, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libgl1-mesa-dev libglu1-mesa-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Download appimagetool
        working-directory: client
        run: |
          mkdir -p build/tools
          wget -q -O build/tools/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/tools/appimagetool

      - name: Build AppImage
        working-directory: client
        env:
          APPIMAGETOOL: ${{ github.workspace }}/client/build/tools/appimagetool
          APPIMAGETOOL_FLAGS: --appimage-extract-and-run
        run: ./packaging/build_appimage.sh

      - name: Stage artifact
        working-directory: client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/VIRA-Link-x86_64.AppImage \
            "$GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-linux-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-linux
          path: dist/${{ needs.meta.outputs.base }}-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows EXE
    needs: [meta, verify]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "$env:GITHUB_WORKSPACE/dist/${{ needs.meta.outputs.base }}-windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.base }}-windows
          path: dist/${{ needs.meta.outputs.base }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: ${{ inputs.create_release }}
    needs: [meta, android, ios, web, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          find . -type f -not -name 'checksums.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: VIRA Link ${{ needs.meta.outputs.version }} (build ${{ needs.meta.outputs.build }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/**/*
