name: Bug report
description: Something is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, device credentials, personal data or
        unredacted logs. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: VIRA version or commit
      placeholder: "0.4.0 or git SHA"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Source (python run.py)
        - Windows installer
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: "Ubuntu 24.04 x86_64, macOS 15 arm64, Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
      description: Redact secrets, tokens and personal data.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output (if applicable)
      description: Paste `python3 -m vira doctor --json` with secrets removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and personal data from logs.
          required: true
